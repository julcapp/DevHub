name: Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  architecture-quality-gate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: current/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r current/requirements.txt

      - name: Run architecture quality gate
        working-directory: current
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m app.workspaces.architecture.cli . --baseline-project ../baseline --bootstrap-if-missing-gate --json --markdown-output architecture-quality-gate.md

      - name: Publish architecture report to job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path current/architecture-quality-gate.md) {
            Get-Content -Raw current/architecture-quality-gate.md >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Publish architecture report to pull request
        if: always()
        continue-on-error: true
        working-directory: current
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          if (Test-Path architecture-quality-gate.md) {
            python -m app.workspaces.architecture.pr_comment architecture-quality-gate.md
          }
