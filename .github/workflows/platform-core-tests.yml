name: Platform Core Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run platform core tests
        run: python -m pytest tests/test_resource_engine.py tests/test_capability_engine.py -q
