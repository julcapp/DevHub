name: Identity Core CI

on:
  pull_request:
    paths:
      - "src/devhub/identity/**"
      - "tests/identity/**"
      - "pyproject.toml"
      - ".github/workflows/identity-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/devhub/identity/**"
      - "tests/identity/**"
      - "pyproject.toml"
      - ".github/workflows/identity-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov ruff mypy

      - name: Ruff
        run: ruff check src/devhub/identity tests/identity

      - name: MyPy
        run: mypy src/devhub/identity

      - name: Pytest with coverage
        run: |
          pytest tests/identity \
            --cov=devhub.identity \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90
